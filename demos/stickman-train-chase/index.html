<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stickman Train Chase — 30s</title><link rel="stylesheet" href="style.css">
<main><header><span>FRAME / 001</span><h1>CHUYẾN TÀU HIỂU NHẦM</h1><span>SVG • 30 GIÂY</span></header>
<svg id="stage" viewBox="0 0 1280 720" role="img" aria-label="Hai stickman rượt đuổi trên nóc tàu"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#153550"/><stop offset="1" stop-color="#f7b980"/></linearGradient><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#577c8d"/><stop offset="1" stop-color="#152b3b"/></linearGradient></defs><g id="picture"></g></svg>
<section class="controls"><button id="play">Play</button><button id="pause">Pause</button><button id="restart">Restart</button><input id="seek" aria-label="Tiến trình" type="range" min="0" max="30" step="0.01" value="0"><output id="time">00.00 / 30.00</output></section><p id="caption"></p><p class="note">Hoạt hình lập trình • Không có API • Kéo thanh tiến trình để kiểm tra từng tư thế</p></main><script src="animation.js"></script></html>
